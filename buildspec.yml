version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies"
      - pip install -r requirements.txt
  pre_build:
    commands:
      - echo "Starting unit tests on `date`"
  build:
    commands:
      - python -m pytest -v --junitxml=test-report.xml
  post_build:
    commands:
      - echo "Build phase finished on `date`"

artifacts:
  files:
    - app.py
    - requirements.txt
    - test-report.xml